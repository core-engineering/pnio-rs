name: CI
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    name: fmt + clippy + test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo test -p pnio --lib --no-default-features
  msrv:
    name: MSRV 1.74 (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.74
      # The library honours rust-version; examples/tests pull dev-dependencies (clap 4.6,
      # edition 2024) that need a newer toolchain and are covered by the stable job.
      - run: cargo check -p pnio
  docs:
    name: rustdoc (-D warnings) + publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps -p pnio
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo publish -p pnio --dry-run
