version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # `dtolnay/rust-toolchain@1.77` pins the MSRV toolchain, not an action version.
      - dependency-name: dtolnay/rust-toolchain
