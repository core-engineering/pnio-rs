[package]
name = "pnio"
version = "0.1.0"
description = "PROFINET RT IO-Device stack in pure Rust (community, not affiliated with PI)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["profinet", "industrial", "real-time", "ethernet", "plc"]
categories = ["network-programming", "embedded"]
readme = "../../README.md"

[dependencies]
libc = "0.2"
log = "0.4"
nix = { version = "0.27", default-features = false, features = ["net", "socket", "poll"] }
pcap-file = { version = "2", optional = true }
thiserror = "1"

[features]
default = ["capture"]
# pcap/pcapng replay harness (`pnio::capture`); off = no `pcap-file` dependency.
capture = ["dep:pcap-file"]

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
roxmltree = "0.20"

[[example]]
name = "rt_bringup"
test = true

[[example]]
name = "typed_bringup"
test = true

[[example]]
name = "latency_probe"
test = true
